      animation: antRotate 1.2s infinite linear;
    }

    .ant-spin-dot {
      position: relative;
      display: inline-block;
      font-size: 20px;
      width: 1em;
      height: 1em;
    }

    .ant-spin {
      -webkit-box-sizing: border-box;
      -moz-box-sizing: border-box;
      box-sizing: border-box;

      padding: 0;

      position: absolute;
      color: #409bda;
      text-align: center;
      vertical-align: middle;
      opacity: 0;
      -webkit-transition: -webkit-transform 0.3s cubic-bezier(0.78, 0.14, 0.15, 0.86);
      transition: -webkit-transform 0.3s cubic-bezier(0.78, 0.14, 0.15, 0.86);

    }

    .ant-spin-lg .ant-spin-dot i {
      width: 14px;
      height: 14px;
    }

    .ant-spin-dot-item:nth-child(1) {
      top: 0;
      left: 0;
    }

    .ant-spin-dot-item:nth-child(2) {
      top: 0;
      right: 0;
      animation-delay: 0.4s;
    }

    .ant-spin-dot-item:nth-child(3) {
      right: 0;
      bottom: 0;
      animation-delay: 0.8s;
    }

    .ant-spin-dot-item:nth-child(4) {
      bottom: 0;
      left: 0;
      animation-delay: 1.2s;
    }

    .ant-spin-dot-item {
      position: absolute;
      display: block;
      width: 9px;
      height: 9px;
      background-color: #409bda;
      -webkit-border-radius: 100%;
      -moz-border-radius: 100%;
      border-radius: 100%;
      -webkit-transform: scale(0.75);
      -moz-transform: scale(0.75);
      -ms-transform: scale(0.75);
      -o-transform: scale(0.75);
      transform: scale(0.75);
      -webkit-transform-origin: 50% 50%;
      -moz-transform-origin: 50% 50%;
      -ms-transform-origin: 50% 50%;
      -o-transform-origin: 50% 50%;
      transform-origin: 50% 50%;
      opacity: 0.3;
      -webkit-animation: antSpinMove 1s infinite linear alternate;
      -moz-animation: antSpinMove 1s infinite linear alternate;
      -o-animation: antSpinMove 1s infinite linear alternate;
      animation: antSpinMove 1s infinite linear alternate;
    }

    .relative {
      position: relative;
    }

    .ant-spin-spinning {
      position: static;
      display: inline-block;
      opacity: 1;
    }

    @keyframes antSpinMove {
      to {
        opacity: 1;
      }
    }

    @keyframes antRotate {
      to {
        transform: rotate(405deg);
      }
    }

  <div id="global-loading">
    <div class="loading-container">

  <script>
    var xhr = new XMLHttpRequest();
    xhr.addEventListener('load', function () {
      if (xhr.status === 200) {
        localStorage.setItem('config', xhr.response);
        var data = JSON.parse(xhr.response);
        document.getElementById('logo-content').src = data.logo;
        document.getElementById('spinner').style.color = data.primaryColor + ' !important';
        var spinner = document.getElementsByClassName('ant-spin-dot-item');
        if (spinner && spinner.style) {
          spinner.style.backgroundColor = data.primaryColor + ' !important';
        }
      }
    });

    let hostApi = 'https://api-v2.edorer.com';
    let currentHostname = window.location.hostname.replace('www', '');

    if (currentHostname === 'localhost') {
      currentHostname = 'lms.paruluniversity.online';
    }

    xhr.open('GET', hostApi + '/api/universities/get-config?url=' + currentHostname);
    xhr.setRequestHeader('Content-Type', 'application/json;charset=UTF-8');
    xhr.send();


    function loadServerCSS(cssUrl) {
      var link = document.createElement('link');
      link.rel = 'stylesheet';
      link.type = 'text/css';
      link.href = cssUrl;
      link.id = 'server-loaded-css';
      document.head.appendChild(link);
    }


    var cssXhr = new XMLHttpRequest();
    cssXhr.addEventListener('load', function () {
      if (cssXhr.status === 200) {
        var style = document.createElement('style');
        style.id = 'server-loaded-css';
        style.textContent = cssXhr.responseText;
        document.head.appendChild(style);
      } else {
        loadServerCSS('/assets/css/custom-theme.css');
      }
    });
    cssXhr.addEventListener('error', function () {
      loadServerCSS('/assets/css/custom-theme.css');
    });
    cssXhr.open('GET', hostApi + '/api/universities/get-custom-css?url=' + currentHostname);
    cssXhr.send();
  </script>

  var loadLib = (url) => {
    let scriptEle = document.createElement('script');

    scriptEle.setAttribute('src', url);
    scriptEle.setAttribute('type', 'text/javascript');

    document.body.appendChild(scriptEle);

    scriptEle.addEventListener('load', () => {
      console.log('File loaded');
    });

    scriptEle.addEventListener('error', (ev) => {
      console.log('Error on loading file', ev);
    });
  };
